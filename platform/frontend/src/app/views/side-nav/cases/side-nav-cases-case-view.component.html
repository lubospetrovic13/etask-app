<div class="case-view-container">
  <div class="content-margin full-height" fxLayout="column" fxLayoutAlign="start stretch">
    <mat-card class="case-view-search-container">
      <div fxLayout="row" fxLayoutAlign="space-between">
        <div fxFlex fxLayoutAlign="start center">
          <nc-search class="search-width"></nc-search>
        </div>
        <nc-create-case-button [newCaseCreationConfig]="newCaseCreationConfig"
                               (caseCreatedEvent)="handleCaseClick($event)"></nc-create-case-button>
      </div>
    </mat-card>

    <div class="transform-div custom-scrollbar" [ngClass]="{'overflow-div': getOverflowStatus()}"
         fxFlex fxLayout="column" fxLayoutAlign="start stretch">
      <div class="transform-div max-width-fix" fxFlex fxLayout="column" fxLayoutAlign="start stretch">
        <nc-header #header [type]="headerType" class="case-header-padding" [ngStyle]="{'width': getWidth()}"></nc-header>

        <nc-case-list [showDeleteMenu]="true" (caseClick)="handleCaseClick($event)"
                      [selectedHeaders$]="selectedHeaders$" [width]="getWidth()" fxFlex></nc-case-list>
      </div>
    </div>
  </div>
</div>
