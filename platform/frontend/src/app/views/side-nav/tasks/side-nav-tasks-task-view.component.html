<div class="task-tab-background full-height">
  <div class="content-margin full-height" fxLayout="column" fxLayoutAlign="start stretch">
    <mat-card class="search-panel">
      <nc-search class="search-width"></nc-search>
    </mat-card>
    <nc-header #header class="task-panel-padding-mini" type="task"></nc-header>
    <!-- app-etask-task-list renders app-etask-task-panel, so our own field components apply here too -->
    <app-etask-task-list [loading$]="loading$" [selectedHeaders$]="selectedHeaders$" [tasks$]="tasks$" fxFlex></app-etask-task-list>
  </div>
</div>
