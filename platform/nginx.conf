# Produkčná nginx konfigurácia pre frontend kontajner.
# Montuje sa cez compose na /etc/nginx/conf.d/default.conf a nahrádza
# default.nginx.conf zo starteru.
#
# Rozdiel proti starteru: pridaná lokácia /api, ktorá proxuje na backend.
# Bez nej frontend v produkcii nemá kam volať - nae.json má natvrdo
# http://localhost:8080/api, čo v prehliadači zákazníka neexistuje.
# S touto proxy a AUTO_RESOLVE_URL=true si frontend adresu odvodí zo
# svojho vlastného originu, takže frontend aj backend sú same-origin
# a CORS sa vôbec nerieši.

map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/json           max;
    application/javascript     max;
    ~image/                    max;
}

upstream etask_backend {
    server backend:8080;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # env.js generuje entrypoint kontajnera pri starte, nesmie sa cachovať
    location = /env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://etask_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Netgrif posiela úlohy a notifikácie aj cez websocket / SSE
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # nahrávanie Petriflow modelov a príloh
        client_max_body_size 64m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    expires $expires;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
