ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

ai.openai.base-url=${AI_OPENAI_BASE_URL:https://api.openai.com}
ai.openai.api-key=${OPENAI_API_KEY:}
# novsie OpenAI modely chcu max_completion_tokens namiesto max_tokens
ai.openai.use-max-completion-tokens=${AI_OPENAI_USE_MAX_COMPLETION_TOKENS:false}

ai.gemini.base-url=${AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ai.gemini.api-version=${AI_GEMINI_API_VERSION:v1beta}
ai.gemini.api-key=${GEMINI_API_KEY:}

# lokalny OpenAI kompatibilny server - Ollama, vLLM, LM Studio
ai.local.base-url=${AI_LOCAL_BASE_URL:http://localhost:11434}

# iny externy OpenAI kompatibilny endpoint - Groq, Together, OpenRouter
ai.custom.base-url=${AI_CUSTOM_BASE_URL:}
ai.custom.api-key=${AI_CUSTOM_API_KEY:}

ai.timeout-seconds=${AI_TIMEOUT_SECONDS:180}
ai.anthropic.base-url=${AI_ANTHROPIC_BASE_URL:https://api.anthropic.com}
