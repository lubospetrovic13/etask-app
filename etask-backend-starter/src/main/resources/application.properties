etask.users.testadmin.email=admin@test.local
etask.users.testadmin.name=Admin Testovaci
etask.users.testadmin.password=${ETASK_TEST_PASSWORD:}
etask.users.testadmin.authorities=ROLE_ADMIN,ROLE_USER

etask.users.testoperator.email=operator@test.local
etask.users.testoperator.name=Operator Testovaci
etask.users.testoperator.password=${ETASK_TEST_PASSWORD:}
etask.users.testoperator.authorities=ROLE_USER

etask.users.testviewer.email=viewer@test.local
etask.users.testviewer.name=Citatel Testovaci
etask.users.testviewer.password=${ETASK_TEST_PASSWORD:}
etask.users.testviewer.authorities=ROLE_USER

etask.users.testsecond.email=druhy@test.local
etask.users.testsecond.name=Druhy Riesitel
etask.users.testsecond.password=${ETASK_TEST_PASSWORD:}
etask.users.testsecond.authorities=ROLE_USER

# ---------------------------------------------------------------
# AI konfiguracia - volanie LLM podla aktivnej konfiguracie
