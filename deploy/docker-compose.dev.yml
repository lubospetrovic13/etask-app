# Vývojový/demo compose pre eTask - CELÝ stack v Dockeri.
#
# Rozdiel proti docker-compose.prod.yml: obrazy sa tu **buildujú** z tohto
# checkoutu (prod ich ťahá z GHCR), sú tu testovacie účty, SMTP server, ktorý
# maily nikam neposiela, a OCR v obraze. Cieľ je, aby Docker Desktop ukázal
# jeden stack `etask` so všetkým, čo appka používa - nie polovicu služieb
# v Dockeri a backend s frontendom niekde na hostiteľovi.
#
#   tools/up.sh --docker             # postaví, zdvihne, počká a naimportuje siete
#   tools/up.sh --docker --build     # vynúti rebuild obrazov
#   tools/up.sh --docker --stop      # zastaví (dáta zostanú vo volumes)
#
# Alebo ručne z priečinka deploy/:
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml logs -f backend
#   docker compose -f docker-compose.dev.yml down          # dáta zostanú
#   docker compose -f docker-compose.dev.yml down -v       # aj dáta ZMAŽE
#
# Čo kde beží:
#   http://localhost:4200   portál (nginx z frontend obrazu, /api proxuje na backend)
#   http://localhost:8080   backend REST API (rovnaký port ako pri lokálnom behu)
#   http://localhost:8025   Mailpit - všetky notifikačné maily appky
#   localhost:27017         Mongo (mongosh z hostiteľa, používa to pfseed --repair)
#   http://localhost:9200   Elasticsearch (na nazeranie do indexu)

name: etask

services:

  mongo:
    image: mongo:6
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1.5"]
    environment:
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-etask}
    ports:
      # Publikované zámerne: `pfseed --repair` a `pucheck --wipe` mažú účty
      # priamo v Mongu, lebo engine na to REST endpoint nemá.
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  elastic:
    image: elasticsearch:7.17.4
    restart: unless-stopped
    environment:
      - cluster.name=elasticsearch
      - discovery.type=single-node
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:6
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Lokálny SMTP server. Maily nikam neodchádzajú - Mailpit ich zachytí
  # a ukáže na http://localhost:8025 aj cez REST API (/api/v1/messages),
  # takže sa notifikácie dajú aj testovať, nielen pozerať.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025"
      # SMTP je vidno aj z hostiteľa - na ručnú skúšku (swaks, telnet).
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      # Kontext je root repozitára - Dockerfile potrebuje aj
      # deploy/vendor-deps.sh a etask-configuration/processes.
      context: ..
      dockerfile: etask-backend-starter/Dockerfile
    image: etask-backend:dev
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      elastic:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      MONGO_URI: mongodb://mongo:27017
      DATABASE_NAME: ${DATABASE_NAME:-etask}
      ELASTIC_URL: elastic
      ELASTIC_PORT: 9300
      ELASTIC_SEARCHPORT: 9200

      # POZOR: NIE `SPRING_REDIS_HOST`. Engine si Jedis factory stavia sam
      # a cita `spring.session.redis.host` cez `@Value` (SessionConfiguration),
      # co application.properties plni z `${REDIS_HOST:localhost}`. Relaxed
      # binding zo `SPRING_REDIS_HOST` na to nesiahne, takze s nim appka bezi
      # na `localhost` a spadne pri starte na
      #   JedisConnectionException: Could not get a resource from the pool
      #   Caused by: java.net.ConnectException: Connection refused
      # co vyzera ako nefunkcny redis kontejner, hoci ten je zdravy.
      REDIS_HOST: redis
      REDIS_PORT: 6379

      NAE_SERVER_URL: ${PUBLIC_URL:-http://localhost:4200}

      # --- notifikačné maily -> Mailpit ---------------------------------
      # `spring.mail.host` má v application.properties default `''` (dva
      # apostrofy, nie prázdny string), takže tu MUSÍ byť naozaj nastavený,
      # inak appka SMTP "má" a každá notifikácia skončí výnimkou v logu.
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_TLS_ENABLED: "false"
      MAIL_AUTH_ENABLED: "false"
      MAIL_FROM: etask@kaskady.local
      MAIL_DOMAIN_APP: localhost
      MAIL_DOMAIN_APP_PORT: 4200
      ETASK_NOTIFICATIONS: "true"

      # --- OCR ----------------------------------------------------------
      # tesseract je v obraze (Dockerfile), takže stačia jazyky.
      ETASK_OCR_LANGUAGES: slk+eng

      # Dev inštancia: testovacie účty MAJÚ vzniknúť, akceptačné testy sa
      # bez nich nedajú spustiť. Na verejnej inštancii to nechaj prázdne.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      ETASK_TEST_PASSWORD: ${ETASK_TEST_PASSWORD:-test1234}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Preindexovanie Elasticu. Engine ho robí ako cron úlohu
      # (`spring.data.elasticsearch.reindex`), ale `reindex-from` má default
      # null, takže po štarte pozerá len na prípady zmenené OD štartu. Keď sa
      # Mongo prenesie na nový stack (alebo sa Elastic zahodí), index je
      # prázdny a v appke to vyzerá, že prípady zmizli - hoci v Mongu sú.
      # Toto ho po štarte dorovná: každé 2 minúty, spätne 30 dní.
      # Zapisuje sa cez SPRING_APPLICATION_JSON, lebo cron výraz obsahuje
      # medzery a v `JAVA_OPTS` by sa rozpadol na viac argumentov.
      SPRING_APPLICATION_JSON: >-
        {"spring.data.elasticsearch.reindex":"0 */2 * * * *",
         "spring.data.elasticsearch.reindex-from":"${ELASTIC_REINDEX_FROM:-P30D}"}

      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xms512m -Xmx2g}
    ports:
      - "8080:8080"
    volumes:
      - backend-storage:/storage
      - backend-certs:/etask/certificates
    healthcheck:
      # /api/auth/login bez prihlásenia odpovedá 401 - to je zdravý stav.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/auth/login | grep -qE '401|405|200'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  frontend:
    build:
      context: ../etask-frontend-starter
      dockerfile: Dockerfile
    image: etask-frontend:dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${FRONTEND_LOG_LEVEL:-error}
      # MUSÍ byť "true" - vtedy si frontend odvodí adresu backendu zo svojho
      # originu a ide na /api, ktoré nginx proxuje na službu `backend`.
      AUTO_RESOLVE_URL: "true"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 4200 zámerne - rovnaká adresa ako pri `ng serve`, takže odkazy
      # a záložky z lokálneho behu fungujú ďalej.
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      # 127.0.0.1, nie `localhost`: v kontejneri sa `localhost` rozlozi najprv
      # na ::1, nginx ale posluchá len na IPv4 0.0.0.0:80 - healthcheck potom
      # hlasi "Connection refused" a sluzba je `unhealthy`, hoci z hostitela
      # odpoveda 200. Sluzby, ktore na nu cakaju (`depends_on`), sa potom
      # nespustia vobec.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
  elastic-data:
  redis-data:
  backend-storage:
  backend-certs:
