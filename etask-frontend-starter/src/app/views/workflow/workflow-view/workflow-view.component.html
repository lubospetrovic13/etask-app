<div class="workflow-container full-height" fxLayout="column" fxLayoutAlign="start stretch">
  <div>
    <!--
      The portal's primary action. It used to be a bare icon FAB: no accessible name, so a
      screen reader announced the font ligature "cloud_upload", and no text, so nothing on
      the screen said what the button was for. Now it carries its label.
    -->
    <!--
      A raised button rather than `mat-fab extended`: the extended FAB only arrived in
      Material 15 and this project is on 13, where the attribute is ignored and the label
      would overflow the round 56px FAB. The stylesheet gives this one the pill shape.
    -->
    <button mat-raised-button color="primary" class="upload-petri-net" (click)="importNet()"
            [attr.aria-label]="'workflow.upload' | translate"
            [matTooltip]="'workflow.uploadHint' | translate" matTooltipPosition="left">
      <mat-icon>cloud_upload</mat-icon>
      <span class="upload-petri-net-label">{{ 'workflow.upload' | translate }}</span>
    </button>
  </div>
  <div fxLayout="row" fxLayoutAlign="center" class="workflow-header">
    <nc-header #header fxFlex="100" [type]="headerType"></nc-header>
  </div>
  <div fxLayout="column" fxLayoutAlign="start center" fxFlex class="workflow-panels-container">
    <ng-container *ngIf="workflows$ | async as workflows">

      <div *ngIf="(loading$ | async) === false && workflows.length === 0" fxLayout="column"
           fxLayoutAlign="center center">
        <mat-icon color="accent" class="font-size-40 block-size-40 margin-bottom-default">linear_scale
        </mat-icon>
        <span class="font-size-20">{{ 'view-list.noProcessesSatisfyingThisFilter' | translate }}</span>
      </div>

      <mat-accordion [multi]="true" fxFlex="100" class="full-width">

        <cdk-virtual-scroll-viewport itemSize="50" (scrolledIndexChange)="loadNextPage()"
                                     class="full-height full-width">

          <app-workflow-panel
            *cdkVirtualFor="let workflow of workflows; let i = index; templateCacheSize: 0; trackBy: trackBy"
            [workflow]="workflow"
            [selectedHeaders$]="selectedHeaders$"
            [showDeleteMenu]="true">
          </app-workflow-panel>

          <div *ngIf="loading$ | async" fxLayout="column" fxLayoutAlign="center center"
               class="margin-top-default">
            <mat-spinner color="primary" diameter="50"></mat-spinner>
          </div>

        </cdk-virtual-scroll-viewport>

      </mat-accordion>
    </ng-container>
  </div>
</div>
