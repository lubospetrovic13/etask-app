<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eTask</title>
  <base href="/">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <script src="env.js"></script>
  <link href="favicon.ico" rel="icon" type="image/x-icon">
  <!-- Inter je pismo Netgrif Design Systemu (`--n-font-family-sans`).
       Roboto zostava, lebo z neho stale cerpa Material typography config. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!--
    Apply the saved theme before the first paint, otherwise the app flashes light
    while styles.css and Angular load. Kept in sync with src/app/theme.service.ts:
    same storage key, same prefers-color-scheme fallback, same class name.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('Theme');
        var dark = saved === 'dark' || (saved !== 'light'
          && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('app-dark');
        }
      } catch (e) {
        /* storage unavailable - stay on the light default */
      }
    })();
  </script>

  <!-- inline spinner styles to be able to display spinner right away -->
  <style type="text/css">
    body, html {
      height: 100%;
    }

    .app-loading {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .app-loading .spinner {
      height: 200px;
      width: 200px;
      animation: rotate 2s linear infinite;
      transform-origin: center center;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      margin: auto;
    }

    .app-loading .spinner .path {
      stroke-dasharray: 1, 200;
      stroke-dashoffset: 0;
      animation: dash 1.5s ease-in-out infinite;
      stroke-linecap: round;
      stroke: #ddd;
    }

    @keyframes rotate {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes dash {
      0% {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -35px;
      }
      100% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -124px;
      }
    }
  </style>
</head>
<body>
<app-root>

  <!-- loading layout replaced by app after startupp -->
  <div class="app-loading">
    <div class="logo"></div>
    <svg class="spinner" viewBox="25 25 50 50">
      <circle class="path" cx="50" cy="50" fill="none" r="20" stroke-miterlimit="10" stroke-width="2"/>
    </svg>
  </div>

</app-root>
</body>
</html>
